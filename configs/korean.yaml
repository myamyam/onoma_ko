seed: 20
device: auto
output_dir: outputs/korean_htsat_kobart
data:
  source_csv_dir: data/onoma/ESC50_csv_files
  csv_dir: outputs/korean_data
  audio_dir: data/onoma/ESC50_audio_(target)
  csv_pattern: S2T_five_clean_{split}.csv
audio:
  sr: 32000
  n_fft: 1024
  hop_length: 320
  f_min: 50
  f_max: 14000
  n_mels: 64
  max_seconds: 10
model:
  htsat_checkpoint: models/onoma_ende/HTSAT.ckpt
  text_model: models/kobart-base-v2
  max_target_tokens: 64
training:
  epochs: 20
  freeze_encoder_epochs: 3
  unfreeze_last_blocks: 1
  batch_size: 4
  eval_batch_size: 4
  accumulation_steps: 4
  num_workers: 0
  decoder_lr: 0.00003
  encoder_lr: 0.000003
  projection_lr: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.1
  grad_clip: 1.0
  amp: true
  patience: 5
generation:
  num_beams: 3
  max_new_tokens: 64
  repetition_penalty: 1.0
  no_repeat_ngram_size: 0
