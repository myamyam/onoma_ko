exp_name: 'HTSAT_BART_exp4'
device: "cuda"
seed: 20


audio_args:
  sr: 32000
  n_fft: 1024
  hop_length: 320
  f_min: 50
  f_max: 14000
  n_mels: 64
  max_length: 10
  mono: True


data_args:
  dataset: "ESC50"
  data_dir: "./data/ESC50"
  num_captions: 5
  batch_size: 16
  num_workers: 8


audio_encoder_args:
  model_arch: "transformer"
  model_name: "htsat"
  pretrained: True
  freeze: False
  spec_augment: False


text_decoder_args:
  decoder_type: "Bart-baseline" # / "ASRdecoder" / "ACdecoder" / "LMDecoder" / "Bart-baseline" / "LSTM"
  name: "facebook/bart-base"
  pretrained: false
  freeze: false

optim_args:
  lr: !!float 3e-5
  weight_decay: !!float 1e-6


training:
  epochs: 20
  # dropout: 0.2
